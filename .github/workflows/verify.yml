name: Проверка StageOS
on:
  push:
    branches: [main, codex/release-readiness]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  core-and-ui:
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-lock.txt ruff
      - run: python -m ruff check backend tests windows/windows_desktop.py --select E9,F63,F7,F82 | tee release-static-results.txt
      - run: python -m pytest tests -q | tee release-test-results.txt
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend | tee release-build-results.txt
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test | tee ../release-ui-results.txt
        working-directory: frontend
      - run: npx playwright test --config playwright.release.config.ts | tee ../release-empty-ui-results.txt
        working-directory: frontend
      - run: npx playwright test --config playwright.accounts.config.ts | tee ../release-accounts-ui-results.txt
        working-directory: frontend
      - run: npx playwright test --config playwright.network.config.ts | tee ../release-network-ui-results.txt
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: проверка-интерфейса
          path: |
            ui-results.json
            release-ui-results.json
            accounts-ui-results.json
            network-ui-results.json
            frontend/test-results
      - uses: actions/upload-artifact@v4
        with:
          name: StageOS-Test-Results
          path: |
            release-*-results.txt
            ui-results.json
            release-ui-results.json
            accounts-ui-results.json
            network-ui-results.json
  windows-portable:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Сборка Windows Portable и backend-тесты
        shell: pwsh
        run: ./build_windows.ps1 -Mode Portable
      - name: Проверка встроенного Python, базы и планировщика
        shell: pwsh
        run: |
          $env:STAGEOS_HOME = Join-Path $env:RUNNER_TEMP 'StageOS-selftest'
          & ./artifacts/StageOS-Portable/runtime/python.exe ./artifacts/StageOS-Portable/app/windows_desktop.py --self-test
          $selftestExit = $LASTEXITCODE
          Get-Content (Join-Path $env:STAGEOS_HOME 'selftest.json') -ErrorAction SilentlyContinue
          Get-Content (Join-Path $env:STAGEOS_HOME 'startup-error.log') -ErrorAction SilentlyContinue
          if ($selftestExit -ne 0) { throw 'Portable self-test failed' }
      - name: Проверка загрузки оконной библиотеки
        shell: pwsh
        run: |
          & ./artifacts/StageOS-Portable/runtime/python.exe -c "import clr; import webview.platforms.winforms; print('CLR and WinForms import: PASS')"
          if ($LASTEXITCODE -ne 0) { throw 'Window host import failed' }
      - name: Запуск настоящего окна WebView2 и завершение приложения
        shell: pwsh
        run: |
          $env:STAGEOS_HOME = Join-Path $env:RUNNER_TEMP 'StageOS-gui-test'
          $process = Start-Process -FilePath ./artifacts/StageOS-Portable/runtime/python.exe -ArgumentList './artifacts/StageOS-Portable/app/windows_desktop.py','--gui-test' -PassThru
          if (-not $process.WaitForExit(90000)) { Stop-Process -Id $process.Id -Force; throw 'Window test timed out' }
          Get-Content (Join-Path $env:STAGEOS_HOME 'gui-selftest.json') -ErrorAction SilentlyContinue
          Get-Content (Join-Path $env:STAGEOS_HOME 'startup-error.log') -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw 'Native GUI test failed' }
          $receipt = Get-Content (Join-Path $env:STAGEOS_HOME 'gui-selftest.json') | ConvertFrom-Json
          if ($receipt.status -ne 'PASS') { throw 'Window receipt failed' }
      - name: Запуск StageOS Server.exe и сетевого слушателя
        shell: pwsh
        run: |
          $env:STAGEOS_HOME = Join-Path $env:RUNNER_TEMP 'StageOS-server-gui-test'
          $process = Start-Process -FilePath './artifacts/StageOS-Portable/StageOS Server.exe' -ArgumentList '--gui-test' -PassThru
          if (-not $process.WaitForExit(90000)) { Stop-Process -Id $process.Id -Force; throw 'Server window test timed out' }
          Get-Content (Join-Path $env:STAGEOS_HOME 'gui-selftest.json') -ErrorAction SilentlyContinue
          Get-Content (Join-Path $env:STAGEOS_HOME 'startup-error.log') -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw 'Server executable failed' }
          $receipt = Get-Content (Join-Path $env:STAGEOS_HOME 'gui-selftest.json') | ConvertFrom-Json
          if ($receipt.status -ne 'PASS' -or $receipt.network_server -ne 'PASS') { throw 'Server GUI receipt failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: StageOS-Windows-Portable
          path: artifacts/StageOS-Portable.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-diagnostics
          path: |
            ${{ runner.temp }}/StageOS-selftest/*.json
            ${{ runner.temp }}/StageOS-selftest/*.log
            ${{ runner.temp }}/StageOS-gui-test/*.json
            ${{ runner.temp }}/StageOS-gui-test/*.log
            ${{ runner.temp }}/StageOS-server-gui-test/*.json
            ${{ runner.temp }}/StageOS-server-gui-test/*.log
