name: Публикация StageOS
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'docs/releases/1.0.0-rc.1.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stageos-release-v1.0.0-rc.1
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: StageOS-Windows-Portable
          path: downloaded
      - run: |
          mkdir -p artifacts
          unzip -q downloaded/StageOS-Portable.zip -d artifacts
          test -f artifacts/StageOS-Portable/StageOS.exe
          python -m pip install -r requirements-lock.txt
          python scripts/create_release_database.py
          python scripts/prepare_release_report.py
          python scripts/package_release.py
          mkdir -p release-assets
          cp ../StageOS-Release-1.0.0-rc.1.zip release-assets/
          cp README_RU.md ARCHITECTURE.md RELEASE_AUDIT_RU.md TEST_RESULTS.md BUILD_RESULTS.md GITHUB_RELEASE_BUILD.md release-assets/
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - name: Опубликовать полный релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v1.0.0-rc.1
          if gh release view "$tag" --json isDraft > /tmp/stageos-existing-release.json 2>/dev/null; then
            echo "Release already exists; refusing to replace published assets."
            exit 1
          fi
          gh release create "$tag" release-assets/* \
            --target "$GITHUB_SHA" \
            --title "StageOS 1.0.0-rc.1 — театр, производство, календарь" \
            --notes-file docs/releases/1.0.0-rc.1.md \
            --prerelease --draft
          gh release edit "$tag" --draft=false
          gh release view "$tag" --json url,assets,isDraft,isPrerelease
