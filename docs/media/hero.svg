ws · Пустая рабочая база · Русский</text></g><text x="64" y="448" font-size="12" fill="#647B6D">ПОСТАНОВКИ / СОТРУДНИКИ / ПЛОЩАДКИ / ОБОРУДОВАНИЕ / ПРОИЗВОДСТВО</text></g></svg>
